<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ChatApp - რეგისტრაცია</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 380px;
            max-width: 95%;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #1877f2;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #42b72a;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #36a420;
        }

        .link {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #1877f2;

            text-decoration: none;
        }

        #message {
            text-align: center;

            margin-top: 15px;

            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>💬 ანგარიშის შექმნა</h1>

    <input
        type="text"
        id="username"
        placeholder="მომხმარებლის სახელი"
        maxlength="30"
    >

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="password"
        id="password"
        placeholder="პაროლი"
    >

    <input
        type="password"
        id="confirmPassword"
        placeholder="გაიმეორე პაროლი"
    >

    <button id="registerButton">
        რეგისტრაცია
    </button>

    <div id="message"></div>

    <a class="link" href="login.html">
        უკვე გაქვს ანგარიში? შედი
    </a>

    <a class="link" href="index.html">
        ← მთავარი გვერდი
    </a>

</div>


<script type="module">

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";

    import {
        getAuth,
        createUserWithEmailAndPassword,
        updateProfile
    }
    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";


    const firebaseConfig = {

        apiKey: "AIzaSyAFkfJ3FPInnW2N0ncFdtJsuUO6mYiottE",

        authDomain: "chatapp-74f6c.firebaseapp.com",

        projectId: "chatapp-74f6c",

        storageBucket:
            "chatapp-74f6c.firebasestorage.app",

        messagingSenderId:
            "569419761940",

        appId:
            "1:569419761940:web:446d6d1981ebd81d705a01"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    const registerButton =
        document.getElementById("registerButton");


    registerButton.addEventListener(
        "click",
        registerUser
    );


    async function registerUser() {

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        const email =
            document
                .getElementById("email")
                .value
                .trim();

        const password =
            document
                .getElementById("password")
                .value;

        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;

        const message =
            document.getElementById("message");


        message.style.color = "red";


        if (
            username === "" ||
            email === "" ||
            password === "" ||
            confirmPassword === ""
        ) {

            message.textContent =
                "გთხოვ ყველა ველი შეავსო.";

            return;
        }


        if (username.length < 3) {

            message.textContent =
                "მომხმარებლის სახელი მინიმუმ 3 სიმბოლო უნდა იყოს.";

            return;
        }


        if (password.length < 6) {

            message.textContent =
                "პაროლი მინიმუმ 6 სიმბოლო უნდა იყოს.";

            return;
        }


        if (password !== confirmPassword) {

            message.textContent =
                "პაროლები ერთმანეთს არ ემთხვევა.";

            return;
        }


        try {

            registerButton.disabled = true;

            registerButton.textContent =
                "იქმნება ანგარიში...";


            const userCredential =
                await createUserWithEmailAndPassword(
                    auth,
                    email,
                    password
                );


            const user =
                userCredential.user;


            await updateProfile(
                user,
                {
                    displayName: username
                }
            );


            message.style.color = "green";

            message.textContent =
                "ანგარიში წარმატებით შეიქმნა!";


            setTimeout(() => {

                window.location.href =
                    "chat.html";

            }, 1200);


        } catch (error) {

            console.log(error);


            message.style.color = "red";


            if (
                error.code ===
                "auth/email-already-in-use"
            ) {

                message.textContent =
                    "ეს Email უკვე გამოყენებულია.";

            }

            else if (
                error.code ===
                "auth/invalid-email"
            ) {

                message.textContent =
                    "Email არასწორად არის შეყვანილი.";

            }

            else if (
                error.code ===
                "auth/weak-password"
            ) {

                message.textContent =
                    "პაროლი ძალიან სუსტია.";

            }

            else {

                message.textContent =
                    "რეგისტრაცია ვერ მოხერხდა. სცადე თავიდან.";

            }


            registerButton.disabled = false;

            registerButton.textContent =
                "რეგისტრაცია";
        }
    }

</script>

</body>
</html>
