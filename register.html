<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp - რეგისტრაცია</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 380px;
            max-width: 95%;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #42b72a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #36a420;
        }

        .link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1877f2;
            text-decoration: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>💬 ანგარიშის შექმნა</h1>

    <input
        type="text"
        id="username"
        placeholder="მომხმარებლის სახელი"
    >

    <input
        type="password"
        id="password"
        placeholder="პაროლი"
    >

    <input
        type="password"
        id="confirmPassword"
        placeholder="გაიმეორე პაროლი"
    >

    <button onclick="register()">
        რეგისტრაცია
    </button>

    <div id="message"></div>

    <a class="link" href="login.html">
        უკვე გაქვს ანგარიში? შედი
    </a>

    <a class="link" href="index.html">
        ← მთავარი გვერდი
    </a>

</div>

<script>
function register() {

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;

    const message =
        document.getElementById("message");

    if (username === "" || password === "" || confirmPassword === "") {
        message.style.color = "red";
        message.textContent = "გთხოვ ყველა ველი შეავსო.";
        return;
    }

    if (username.length < 3) {
        message.style.color = "red";
        message.textContent =
            "მომხმარებლის სახელი მინიმუმ 3 სიმბოლო უნდა იყოს.";
        return;
    }

    if (password.length < 6) {
        message.style.color = "red";
        message.textContent =
            "პაროლი მინიმუმ 6 სიმბოლო უნდა იყოს.";
        return;
    }

    if (password !== confirmPassword) {
        message.style.color = "red";
        message.textContent =
            "პაროლები ერთმანეთს არ ემთხვევა.";
        return;
    }

    const users =
        JSON.parse(localStorage.getItem("chatUsers")) || [];

    const exists =
        users.some(user => user.username === username);

    if (exists) {
        message.style.color = "red";
        message.textContent =
            "ეს მომხმარებელი უკვე არსებობს.";
        return;
    }

    users.push({
        username: username,
        password: password
    });

    localStorage.setItem(
        "chatUsers",
        JSON.stringify(users)
    );

    message.style.color = "green";
    message.textContent =
        "ანგარიში წარმატებით შეიქმნა!";

    setTimeout(() => {
        window.location.href = "login.html";
    }, 1200);
}
</script>

</body>
</html>
