<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 380px;
            max-width: 95%;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #777;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #1877f2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d65d9;
        }

        .register {
            background: #42b72a;
        }

        .register:hover {
            background: #36a420;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>💬 ChatApp</h1>

        <p>ეს არის შენი საკუთარი საკომუნიკაციო პლატფორმა</p>

        <button onclick="location.href='login.html'">
            შესვლა
        </button>

        <button class="register" onclick="location.href='register.html'">
            რეგისტრაცია
        </button>
    </div>

</body>
</html>
