<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #e9edef;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            height: 100vh;
            display: flex;
        }

        /* მარცხენა მხარე */
        .sidebar {
            width: 330px;
            background: white;
            border-right: 1px solid #ddd;
            display: flex;
            flex-direction: column;
        }

        .top {
            padding: 20px;
            background: #1877f2;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top h2 {
            font-size: 21px;
        }

        .logout {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        .search {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .search input {
            width: 100%;
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
        }

        .user-list {
            overflow-y: auto;
            flex: 1;
        }

        .user {
            padding: 15px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }

        .user:hover {
            background: #f0f2f5;
        }

        .user-name {
            font-weight: bold;
        }

        .status {
            font-size: 13px;
            color: #42b72a;
            margin-top: 4px;
        }

        /* ჩატის მხარე */
        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #efeae2;
        }

        .chat-header {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 1px solid #ddd;
        }

        .chat-header h3 {
            font-size: 18px;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .welcome {
            text-align: center;
            margin-top: 100px;
            color: #777;
        }

        .message {
            max-width: 70%;
            padding: 10px 14px;
            margin-bottom: 10px;
            border-radius: 12px;
            word-wrap: break-word;
        }

        .sent {
            margin-left: auto;
            background: #d9fdd3;
        }

        .received {
            margin-right: auto;
            background: white;
        }

        .message-time {
            display: block;
            font-size: 10px;
            color: #777;
            margin-top: 4px;
            text-align: right;
        }

        .input-area {
            background: white;
            padding: 12px;
            display: flex;
            gap: 10px;
        }

        .input-area input {
            flex: 1;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
        }

        .send {
            width: 50px;
            border: none;
            border-radius: 50%;
            background: #1877f2;
            color: white;
            cursor: pointer;
            font-size: 18px;
        }

        /* ტელეფონი */
        @media (max-width: 700px) {

            .sidebar {
                width: 100%;
            }

            .chat {
                display: none;
            }

            .sidebar.mobile-hidden {
                display: none;
            }

            .chat.mobile-show {
                display: flex;
                width: 100%;
            }

            .back-button {
                display: block;
            }
        }

        .back-button {
            display: none;
            background: none;
            border: none;
            font-size: 20px;
            margin-right: 12px;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .back-button {
                display: block;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- მარცხენა მხარე -->
    <div class="sidebar" id="sidebar">

        <div class="top">
            <h2>ChatApp</h2>
            <button class="logout" onclick="logout()">
                გამოსვლა
            </button>
        </div>

        <div class="search">
            <input
                type="text"
                id="searchInput"
                placeholder="მომხმარებლის ძებნა..."
                oninput="searchUsers()"
            >
        </div>

        <div class="user-list" id="userList"></div>

    </div>


    <!-- ჩატი -->
    <div class="chat" id="chat">

        <div class="chat-header">

            <button class="back-button" onclick="backToUsers()">
                ←
            </button>

            <h3 id="chatName">
                აირჩიე მომხმარებელი
            </h3>

        </div>

        <div class="messages" id="messages">

            <div class="welcome">
                <h2>💬</h2>
                <p>აირჩიე ადამიანი ჩატის დასაწყებად</p>
            </div>

        </div>

        <div class="input-area">

            <input
                type="text"
                id="messageInput"
                placeholder="დაწერე შეტყობინება..."
                onkeydown="handleEnter(event)"
            >

            <button class="send" onclick="sendMessage()">
                ➤
            </button>

        </div>

    </div>

</div>


<script>

    /* მომხმარებლის შემოწმება */

    const currentUser =
        localStorage.getItem("currentUser");

    if (!currentUser) {
        window.location.href = "login.html";
    }


    let selectedUser = null;


    /* მომხმარებლების ჩვენება */

    function loadUsers() {

        const users =
            JSON.parse(localStorage.getItem("chatUsers")) || [];

        const userList =
            document.getElementById("userList");

        userList.innerHTML = "";

        users
            .filter(user => user.username !== currentUser)
            .forEach(user => {

                const div =
                    document.createElement("div");

                div.className = "user";

                div.innerHTML = `
                    <div class="user-name">
                        ${escapeHTML(user.username)}
                    </div>

                    <div class="status">
                        ● ონლაინ
                    </div>
                `;

                div.onclick = () => openChat(user.username);

                userList.appendChild(div);
            });

        if (userList.innerHTML === "") {

            userList.innerHTML = `
                <div style="
                    padding:20px;
                    text-align:center;
                    color:#777;
                ">
                    ჯერ სხვა მომხმარებელი არ არის.
                </div>
            `;
        }
    }


    /* მომხმარებლის ძებნა */

    function searchUsers() {

        const search =
            document
                .getElementById("searchInput")
                .value
                .toLowerCase();

        const users =
            JSON.parse(localStorage.getItem("chatUsers")) || [];

        const userList =
            document.getElementById("userList");

        userList.innerHTML = "";

        users
            .filter(user =>
                user.username !== currentUser &&
                user.username
                    .toLowerCase()
                    .includes(search)
            )
            .forEach(user => {

                const div =
                    document.createElement("div");

                div.className = "user";

                div.innerHTML = `
                    <div class="user-name">
                        ${escapeHTML(user.username)}
                    </div>

                    <div class="status">
                        ● ონლაინ
                    </div>
                `;

                div.onclick =
                    () => openChat(user.username);

                userList.appendChild(div);
            });
    }


    /* ჩატის გახსნა */

    function openChat(username) {

        selectedUser = username;

        document
            .getElementById("chatName")
            .textContent = username;

        loadMessages();

        if (window.innerWidth <= 700) {

            document
                .getElementById("sidebar")
                .classList.add("mobile-hidden");

            document
                .getElementById("chat")
                .classList.add("mobile-show");
        }
    }


    /* ჩატის ID */

    function getChatId() {

        if (!selectedUser) return null;

        return [
            currentUser,
            selectedUser
        ]
        .sort()
        .join("_");
    }


    /* შეტყობინებების ჩატვირთვა */

    function loadMessages() {

        const messagesBox =
            document.getElementById("messages");

        messagesBox.innerHTML = "";

        if (!selectedUser) {

            messagesBox.innerHTML = `
                <div class="welcome">
                    <h2>💬</h2>
                    <p>
                        აირჩიე ადამიანი ჩატის დასაწყებად
                    </p>
                </div>
            `;

            return;
        }

        const chatId = getChatId();

        const allMessages =
            JSON.parse(
                localStorage.getItem("messages")
            ) || {};

        const messages =
            allMessages[chatId] || [];

        messages.forEach(message => {

            const div =
                document.createElement("div");

            div.className =
                "message " +
                (message.from === currentUser
                    ? "sent"
                    : "received");

            div.innerHTML = `
                ${escapeHTML(message.text)}

                <span class="message-time">
                    ${message.time}
                </span>
            `;

            messagesBox.appendChild(div);
        });

        messagesBox.scrollTop =
            messagesBox.scrollHeight;
    }


    /* შეტყობინების გაგზავნა */

    function sendMessage() {

        if (!selectedUser) {

            alert("ჯერ აირჩიე მომხმარებელი.");

            return;
        }

        const input =
            document.getElementById("messageInput");

        const text =
            input.value.trim();

        if (!text) return;

        const chatId = getChatId();

        const allMessages =
            JSON.parse(
                localStorage.getItem("messages")
            ) || {};

        if (!allMessages[chatId]) {
            allMessages[chatId] = [];
        }

        const now =
            new Date();

        const time =
            now.toLocaleTimeString(
                "ka-GE",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

        allMessages[chatId].push({

            from: currentUser,

            to: selectedUser,

            text: text,

            time: time
        });

        localStorage.setItem(
            "messages",
            JSON.stringify(allMessages)
        );

        input.value = "";

        loadMessages();
    }


    /* Enter ღილაკი */

    function handleEnter(event) {

        if (event.key === "Enter") {
            sendMessage();
        }
    }


    /* უკან */

    function backToUsers() {

        document
            .getElementById("sidebar")
            .classList.remove("mobile-hidden");

        document
            .getElementById("chat")
            .classList.remove("mobile-show");
    }


    /* გამოსვლა */

    function logout() {

        localStorage.removeItem("currentUser");

        window.location.href =
            "login.html";
    }


    /* უსაფრთხო ტექსტი */

    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;
    }


    /* დაწყება */

    loadUsers();

</script>

</body>
</html>
