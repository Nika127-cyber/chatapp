<!DOCTYPE html>
<html lang="ka">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ChatApp - შესვლა</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background: #f0f2f5;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;
        }


        .box {

            width: 380px;

            max-width: 95%;

            background: white;

            padding: 35px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.15);
        }


        h1 {

            text-align: center;

            margin-bottom: 25px;
        }


        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 15px;

            border: 1px solid #ddd;

            border-radius: 10px;

            font-size: 16px;

            outline: none;
        }


        input:focus {

            border-color: #1877f2;
        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #1877f2;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }


        button:hover {

            background: #0d65d9;
        }


        button:disabled {

            background: #999;

            cursor: not-allowed;
        }


        .link {

            display: block;

            text-align: center;

            margin-top: 20px;

            color: #1877f2;

            text-decoration: none;
        }


        #message {

            text-align: center;

            margin-top: 15px;

            font-size: 14px;
        }

    </style>

</head>


<body>


<div class="box">


    <h1>💬 ChatApp</h1>


    <input
        type="email"
        id="email"
        placeholder="Email"
    >


    <input
        type="password"
        id="password"
        placeholder="პაროლი"
    >


    <button id="loginButton">

        შესვლა

    </button>


    <div id="message"></div>


    <a
        class="link"
        href="register.html"
    >
        ანგარიში არ გაქვს? დარეგისტრირდი
    </a>


    <a
        class="link"
        href="index.html"
    >
        ← მთავარი გვერდი
    </a>


</div>



<script type="module">


    import { initializeApp }

        from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";


    import {

        getAuth,

        signInWithEmailAndPassword

    }

    from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";



    const firebaseConfig = {


        apiKey:
            "AIzaSyAFkfJ3FPInnW2N0ncFdtJsuUO6mYiottE",


        authDomain:
            "chatapp-74f6c.firebaseapp.com",


        projectId:
            "chatapp-74f6c",


        storageBucket:
            "chatapp-74f6c.firebasestorage.app",


        messagingSenderId:
            "569419761940",


        appId:
            "1:569419761940:web:446d6d1981ebd81d705a01"

    };



    const app =
        initializeApp(firebaseConfig);



    const auth =
        getAuth(app);



    const loginButton =
        document.getElementById(
            "loginButton"
        );



    loginButton.addEventListener(
        "click",
        loginUser
    );



    async function loginUser() {


        const email =

            document
                .getElementById("email")
                .value
                .trim();


        const password =

            document
                .getElementById("password")
                .value;


        const message =

            document
                .getElementById("message");



        message.style.color = "red";



        if (
            email === "" ||
            password === ""
        ) {

            message.textContent =
                "გთხოვ შეავსო ორივე ველი.";

            return;
        }



        try {


            loginButton.disabled = true;


            loginButton.textContent =
                "მიმდინარეობს შესვლა...";



            await signInWithEmailAndPassword(

                auth,

                email,

                password

            );



            message.style.color =
                "green";


            message.textContent =
                "წარმატებით შეხვედი!";



            setTimeout(() => {

                window.location.href =
                    "chat.html";

            }, 700);



        }


        catch (error) {


            console.log(error);


            message.style.color =
                "red";



            if (

                error.code ===
                "auth/invalid-credential"

            ) {

                message.textContent =
                    "Email ან პაროლი არასწორია.";

            }


            else if (

                error.code ===
                "auth/user-not-found"

            ) {

                message.textContent =
                    "ასეთი ანგარიში არ არსებობს.";

            }


            else {

                message.textContent =
                    "შესვლა ვერ მოხერხდა. სცადე თავიდან.";

            }



            loginButton.disabled =
                false;


            loginButton.textContent =
                "შესვლა";

        }

    }


</script>


</body>

</html>
