<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatApp - შესვლა</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 380px;
            max-width: 95%;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #1877f2;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0d65d9;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1877f2;
            text-decoration: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: red;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>💬 შესვლა</h1>

    <input
        type="text"
        id="username"
        placeholder="მომხმარებლის სახელი"
    >

    <input
        type="password"
        id="password"
        placeholder="პაროლი"
    >

    <button onclick="login()">
        შესვლა
    </button>

    <div id="message"></div>

    <a class="back" href="register.html">
        ანგარიში არ გაქვს? დარეგისტრირდი
    </a>

    <a class="back" href="index.html">
        ← უკან
    </a>

</div>

<script>
function login() {

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (username === "" || password === "") {
        document.getElementById("message").textContent =
            "გთხოვ შეავსო ორივე ველი.";
        return;
    }

    const users = JSON.parse(localStorage.getItem("chatUsers")) || [];

    const user = users.find(
        u => u.username === username && u.password === password
    );

    if (!user) {
        document.getElementById("message").textContent =
            "მომხმარებელი ან პაროლი არასწორია.";
        return;
    }

    localStorage.setItem("currentUser", username);

    window.location.href = "chat.html";
}
</script>

</body>
</html>
